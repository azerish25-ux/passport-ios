name: iOS Build

# The prototype is authored on Windows, where no Xcode toolchain exists. This
# workflow is therefore the only place the app is ever actually compiled, and it
# is the source of truth for "does it build".

on:
  push:
    branches: [main]
    paths-ignore:
      - Tools/VisionProbe.swift
      - Tools/run_vision_probe.py
      - .github/workflows/vision-probe.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Write access is needed only so a failed run can publish its own digest to a
# diagnostics branch; nothing is ever pushed to main.
permissions:
  contents: write

env:
  PROJECT: PassportProof.xcodeproj
  SCHEME: PassportProof
  APP_NAME: PassportProof
  XCODE_DEVELOPER_PATH: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  # Compiles the app for the simulator, then runs the unit tests on a concrete
  # simulator resolved at runtime. Hardcoding a device name (iPhone 16, iPhone 17)
  # is the most common way this kind of workflow breaks when the runner image
  # rotates, so the device is discovered instead of assumed.
  build-and-test:
    name: Build, unit tests & UI tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and report Xcode 26.3
        run: |
          set -euo pipefail
          if [ ! -x "$XCODE_DEVELOPER_PATH/usr/bin/xcodebuild" ]; then
            echo "::error::Required Xcode 26.3 is not installed at $XCODE_DEVELOPER_PATH"
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_DEVELOPER_PATH"
          DEVICE_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "Developer directory: $(xcode-select -p)" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Device SDK: $DEVICE_SDK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Simulator SDK: $SIMULATOR_SDK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl list runtimes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        run: |
          # PassportProof.xcodeproj is generated, not checked in. Without this
          # every later step fails with "project does not exist".
          python3 Tools/generate_project.py

      - name: Validate project structure
        run: |
          # xcodebuild -list parses the project and enumerates targets and
          # schemes. If the pbxproj is malformed this fails here, before a
          # 20-minute compile, with a message that names the bad object.
          xcodebuild -list -project "$PROJECT"

      - name: Assert shared scheme exists
        run: |
          set -euo pipefail
          SCHEME_FILE="$PROJECT/xcshareddata/xcschemes/$SCHEME.xcscheme"
          if [ ! -f "$SCHEME_FILE" ]; then
            echo "::error::Shared scheme not found at $SCHEME_FILE"
            exit 1
          fi
          echo "Shared scheme present: $SCHEME_FILE"

      - name: Build for simulator
        id: build_sim
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/simulator-build.log

      - name: Build test bundles
        id: build_tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/test-bundles.log

      - name: Resolve an iPhone simulator matching the selected SDK
        id: sim
        run: |
          set -euo pipefail
          SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          python3 - "$SIMULATOR_SDK" <<'PYSIM'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          def version_parts(value):
              try:
                  return tuple(int(part) for part in value.split("."))
              except ValueError:
                  return ()

          sdk = sys.argv[1]
          sdk_version = version_parts(sdk)
          if len(sdk_version) < 2:
              raise SystemExit(f"Cannot determine major/minor version of simulator SDK: {sdk!r}")
          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "-j", "runtimes"], text=True
          ))["runtimes"]
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "-j", "devices", "available"], text=True
          ))["devices"]
          available_ios = [runtime for runtime in runtimes
                           if runtime.get("isAvailable")
                           and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          matching = [runtime for runtime in available_ios
                      if version_parts(runtime["version"])[:2] == sdk_version[:2]]
          selected = None
          for runtime in sorted(matching, key=lambda item: version_parts(item["version"]), reverse=True):
              for device in devices.get(runtime["identifier"], []):
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      selected = (runtime, device)
                      break
              if selected:
                  break
          if selected is None:
              available = ", ".join(runtime["version"] for runtime in available_ios) or "none"
              raise SystemExit(
                  f"No available iPhone simulator matches SDK {sdk_version[0]}.{sdk_version[1]}. "
                  f"Available iOS runtimes: {available}. Refusing an unrelated runtime."
              )

          runtime, device = selected
          details = (
              f"Simulator SDK: {sdk}\n"
              f"Runtime: {runtime['name']} {runtime['version']} "
              f"(build {runtime.get('buildversion', 'unknown')}; {runtime['identifier']})\n"
              f"Device: {device['name']} ({device['udid']})\n"
          )
          print(details, end="")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"udid={device['udid']}\n")
              output.write(f"runtime={runtime['identifier']}\n")
              output.write(f"runtime_version={runtime['version']}\n")
              output.write(f"sdk_version={sdk}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n### Selected simulator\n\n```text\n" + details + "```\n")
          PYSIM

      - name: Prepare clean simulator and photo-library fixture
        timeout-minutes: 6
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          # This is the disposable Actions simulator, not a developer device.
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          cp PassportProofTests/AssessmentAssets.xcassets/FullResolutionPortrait.imageset/full-resolution-portrait.jpg build/PassportProof-QA-Portrait.jpg
          xcrun simctl addmedia "$UDID" build/PassportProof-QA-Portrait.jpg

      - name: Run unit tests
        id: unit
        timeout-minutes: 15
        run: |
          # Unit and UI tests are separate steps so a simulator automation issue
          # cannot hide a unit-test result (or vice versa).
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/UnitResults.xcresult \
            -only-testing:PassportProofTests \
            -skip-testing:PassportProofUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            2>&1 | tee build/unit-test.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "xcodebuild unit-test exit status: $STATUS"
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ test|Test Suite 'PassportProofTests" build/unit-test.log >> "$GITHUB_STEP_SUMMARY" || echo "no summary line found" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Unit tests failed (exit $STATUS)"
            grep -E "error:|failed|Assertion Failure" build/unit-test.log | head -60 || true
            exit "$STATUS"
          fi
          if ! grep -q "Test Suite 'PassportProofTests.xctest' passed" build/unit-test.log; then
            echo "::error::The unit-test suite did not report a passing result"
            exit 1
          fi
          if ! grep -Eq "Executed [1-9][0-9]* tests" build/unit-test.log; then
            echo "::error::No unit tests were executed"
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path build/UnitResults.xcresult > build/unit-summary.json
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          summary = json.loads(Path("build/unit-summary.json").read_text())
          if summary.get("skippedTests", 0) or summary.get("expectedFailures", 0):
              raise SystemExit("Repair verification requires zero skipped tests and zero expected failures")
          if summary.get("failedTests", 0) or summary.get("passedTests", 0) == 0:
              raise SystemExit("No complete passing unit-test result")
          print("Verified unit result:", summary["passedTests"], "passed; no skipped or expected failures")
          PYTEST

      - name: Export assessment diagnostics
        if: always()
        run: |
          mkdir -p build/assessment-diagnostics
          if [ -f build/unit-test.log ]; then
            cp build/unit-test.log build/assessment-diagnostics/unit-test.log
          fi
          if [ -d build/UnitResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/UnitResults.xcresult \
              --output-path build/assessment-diagnostics || true
            xcrun xcresulttool get test-results summary \
              --path build/UnitResults.xcresult \
              > build/assessment-diagnostics/unit-summary.json || true
          fi

      - name: Upload assessment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-diagnostics
          path: build/assessment-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Run UI tests
        id: ui
        # Keep navigation/screenshot evidence available when a unit diagnostic
        # finds a defect, while preserving the unit step's failed conclusion.
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          set +e
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/UIResults.xcresult \
            -only-testing:PassportProofUITests \
            -skip-testing:PassportProofTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            2>&1 | tee build/ui-test.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "xcodebuild UI-test exit status: $STATUS"
          echo "### UI tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ test|Test Suite 'PassportProofUITests|Test Case .*failed" build/ui-test.log >> "$GITHUB_STEP_SUMMARY" || echo "no summary line found" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::UI tests failed (exit $STATUS)"
            # An unsupported test case and a crashed runner both end in exit 65,
            # so name the failing cases first and then whatever the runner
            # said last. Both are workflow commands: without them the cause of
            # a red UI leg exists only inside an artifact nobody downloads.
            FAILED=$(grep -E "Test Case .*failed|Assertion Failure|error:" build/ui-test.log | head -20 || true)
            if [ -z "$FAILED" ]; then
              FAILED=$(grep -E "crash|Crash|Restarting after unexpected exit|Test runner exited|Lost connection|Failed to (launch|terminate)|EXC_|signal|Timed out|timed out" build/ui-test.log | head -20 || true)
            fi
            if [ -z "$FAILED" ]; then
              FAILED=$(grep -E "Test Suite|Executed [0-9]+ test|exit status|xcodebuild" build/ui-test.log | tail -20 || true)
            fi
            if [ -n "$FAILED" ]; then
              printf '%s\n' "$FAILED" | sed 's/%/%%/g' | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
            exit "$STATUS"
          fi
          if ! grep -q "Test Suite 'PassportProofUITests.xctest' passed" build/ui-test.log; then
            echo "::error::The UI-test suite did not report a passing result"
            exit 1
          fi
          if ! grep -Eq "Executed [1-9][0-9]* tests" build/ui-test.log; then
            echo "::error::No UI tests were executed"
            exit 1
          fi

      - name: Report simulator crashes
        # A crashed app or test runner exits the step with 65 and prints no
        # failing test case, so without this a red UI leg has no named cause.
        if: always()
        run: |
          mkdir -p build/diagnostics
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          FOUND=0
          if [ -d "$CRASH_DIR" ]; then
            while IFS= read -r report; do
              [ -n "$report" ] || continue
              FOUND=1
              cp "$report" build/diagnostics/ || true
              echo "::error::Crash report: $(basename "$report")"
              grep -m 6 -E "Exception Type|Exception Codes|Termination Reason|Triggered by Thread|^[0-9]+ +PassportProof" "$report" | while IFS= read -r line; do
                echo "::error::$line"
              done
            done <<< "$(ls -1 "$CRASH_DIR"/*PassportProof* 2>/dev/null || true)"
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "No PassportProof crash report was written."
          fi

      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/UIResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/UIResults.xcresult \
              --output-path build/screenshots || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/UnitResults.xcresult
            build/UIResults.xcresult
            build/unit-test.log
            build/ui-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: build/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload built app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PassportProof-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/${{ env.APP_NAME }}.app
          if-no-files-found: error
          retention-days: 7

      # Compiler errors and XCTest failures are emitted as workflow commands so
      # they become annotations on the run. Without this a red iOS run can only
      # be diagnosed by downloading the .xcresult, which is the single biggest
      # reason failures stayed open across commits.
      - name: Publish failure annotations
        if: always()
        run: |
          # Only parse the log of a step that actually failed. Annotating a
          # passing log just buries the real failure under diagnostic chatter.
          report() { python3 Tools/ci_report.py --label "$1" --log "$2" || true; }
          if [ "${{ steps.build_sim.outcome }}" = "failure" ]; then report simulator-build build/simulator-build.log; fi
          if [ "${{ steps.build_tests.outcome }}" = "failure" ]; then report test-bundles build/test-bundles.log; fi
          if [ "${{ steps.unit.outcome }}" = "failure" ]; then report unit build/unit-test.log; fi
          if [ "${{ steps.ui.outcome }}" = "failure" ]; then report ui build/ui-test.log; fi
          exit 0

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*.log
            build/diagnostics/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish failure digest to a diagnostics branch
        # Artifacts and annotations both need an authenticated client. A failed
        # run therefore used to be unreadable from an unattended session, which
        # is exactly how the same failure could survive several commits. The
        # digest is a plain file on `ci-diagnostics` and never touches main.
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          set +e
          {
            echo "# CI diagnostics — run ${{ github.run_number }}"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo "Event: ${{ github.event_name }}"
            echo
            for f in build/simulator-build.log build/test-bundles.log build/unit-test.log build/ui-test.log; do
              [ -f "$f" ] || continue
              echo "## $f"
              echo '```text'
              grep -nE "Test Case .*failed|Test Suite .*(passed|failed)|Executed [0-9]+ test|error:|Assertion Failure|Restarting after unexpected exit|Failed to launch|Failed to terminate|Testing failed|Unable to boot|BUILD FAILED|command returned" "$f" | tail -60
              echo '--- last 40 lines ---'
              tail -40 "$f"
              echo '```'
              echo
            done
          } > ci-failure.md
          wc -l ci-failure.md
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git config user.name "CI diagnostics"
          git checkout -B ci-diagnostics
          git add -f ci-failure.md
          git commit -m "CI diagnostics for run ${{ github.run_number }}" || exit 0
          git push --force origin ci-diagnostics

  # Proves the same sources compile for arm64 device against the iOS SDK. This
  # catches simulator-only API misuse and any missing framework link that the
  # simulator build would tolerate. Signing is disabled: the prototype has no
  # provisioning profile and does not need one to prove it compiles.
  device-build:
    name: Build (generic iOS device, unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and report Xcode 26.3
        run: |
          set -euo pipefail
          if [ ! -x "$XCODE_DEVELOPER_PATH/usr/bin/xcodebuild" ]; then
            echo "::error::Required Xcode 26.3 is not installed at $XCODE_DEVELOPER_PATH"
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_DEVELOPER_PATH"
          DEVICE_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "Developer directory: $(xcode-select -p)" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Device SDK: $DEVICE_SDK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Simulator SDK: $SIMULATOR_SDK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        run: python3 Tools/generate_project.py

      - name: Build for device
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/device-build.log

      - name: Audit the Release bundle
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          BINARY="$APP/$APP_NAME"

          echo "Release bundle files:" >> "$GITHUB_STEP_SUMMARY"
          find "$APP" -maxdepth 1 -type f -print | sort | tee -a "$GITHUB_STEP_SUMMARY"

          for required in "$BINARY" "$APP/PrivacyInfo.xcprivacy" "$APP/AppIcon60x60@2x.png" "$APP/Assets.car"; do
            if [ ! -f "$required" ]; then
              echo "::error::Required Release bundle file is missing: $required"
              exit 1
            fi
          done

          # Read the complete strings output first. grep -q in a pipe can close
          # early, make strings fail with SIGPIPE and hide a match under pipefail.
          strings "$BINARY" > build/release-strings.txt
          if grep -Fq "Continue with debug unlock" build/release-strings.txt; then
            echo "::error::DEBUG purchase bypass text is present in the Release binary"
            exit 1
          fi
          if grep -Fq "Debug demonstration unlock" build/release-strings.txt; then
            echo "::error::DEBUG entitlement path is present in the Release binary"
            exit 1
          fi

          if [ -n "$(find "$APP" -name '*.storekit' -print -quit)" ]; then
            echo "::error::Local StoreKit test configuration is present in the Release app"
            exit 1
          fi

          plutil -extract UILaunchScreen xml1 -o - "$APP/Info.plist"
          plutil -extract NSCameraUsageDescription raw -o - "$APP/Info.plist"
          plutil -extract NSPhotoLibraryUsageDescription raw -o - "$APP/Info.plist"

          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > build/assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          assets = json.loads(Path("build/assets.json").read_text())
          names = {item.get("Name") for item in assets if isinstance(item, dict)}
          for required in ("AppIcon", "LaunchSymbol"):
              if required not in names:
                  raise SystemExit(f"compiled asset is missing: {required}; found {sorted(n for n in names if n)}")
          print("compiled assets present:", "AppIcon", "LaunchSymbol")
          PY

          echo "Release bundle audit passed: icon, launch symbol, privacy manifest, usage strings, no DEBUG unlock." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure annotations
        if: always()
        run: python3 Tools/ci_report.py --label device-build --log build/device-build.log || true

      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-log
          path: build/device-build.log
          if-no-files-found: warn
          retention-days: 14
